# The Brain (discovery): hunter.py qualifies public-surface signals and
# POSTs confirmed leads to the Body's /capture. Runs where an always-on
# worker would have (worker.sh's 6-hour loop) - GitHub hosts the schedule.
name: hunter-discovery
on:
  schedule:
    - cron: "43 */6 * * *"   # every 6 hours, same cadence as HUNTER_INTERVAL_SECONDS
  workflow_dispatch:

concurrency:
  group: hunter-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run a discovery pass
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          HUNTER_LIMIT: "10"
        run: python hunter.py --api "$SITE_URL" --csv marketing/icp_targets.csv --limit "$HUNTER_LIMIT" --defer
