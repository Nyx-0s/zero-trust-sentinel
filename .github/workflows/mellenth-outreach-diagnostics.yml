name: mellenth-outreach-diagnostics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mellenth-outreach-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install database diagnostic dependency
        run: pip install asyncpg
      - name: Diagnose lead eligibility and webhook readiness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key=os.getenv("SENDGRID_API_KEY","")
          if os.getenv("DATABASE_URL"):
            try:
              import asyncio, asyncpg
              async def dbcheck():
                conn=await asyncpg.connect(os.environ["DATABASE_URL"], timeout=10, ssl="require")
                try:
                  rows=await conn.fetch("""
                    SELECT status, COALESCE(marketing_consent,FALSE) AS consent, count(*) AS n
                    FROM lead_tasks GROUP BY status, COALESCE(marketing_consent,FALSE)
                    ORDER BY status, consent
                  """)
                  print("LEAD_COUNTS", json.dumps([dict(r) for r in rows], default=str))
                  print("SENDS_TODAY_DB", await conn.fetchval("SELECT count(*) FROM lead_stages WHERE sent_at >= date_trunc('day', NOW())"))
                finally:
                  await conn.close()
              asyncio.run(dbcheck())
            except Exception as e:
              print("DB_DIAGNOSTIC_ERROR", type(e).__name__, str(e)[:300])
          else:
            print("DB_DIAGNOSTIC_SKIPPED")
          if not key:
            print("SENDGRID_API_KEY_MISSING")
            raise SystemExit(0)
          req=urllib.request.Request("https://api.sendgrid.com/v3/user/webhooks/event/settings",headers={"Authorization":"Bearer "+key})
          try:
            with urllib.request.urlopen(req,timeout=20) as res:
              cfg=json.loads(res.read().decode())
              print("EVENT_WEBHOOK",json.dumps({k:cfg.get(k) for k in ("enabled","url","delivered","bounce","deferred","processed") if k in cfg}))
              print("EVENT_WEBHOOK_PUBLIC_KEY_PRESENT",bool(cfg.get("public_key")))
          except urllib.error.HTTPError as e:
            print("EVENT_WEBHOOK_HTTP",e.code)
          try:
            req=urllib.request.Request("https://zero-trust-sentinel-opal-lake.vercel.app/webhooks/sendgrid/events",data=b"[]",headers={"Content-Type":"application/json"},method="POST")
            with urllib.request.urlopen(req,timeout=15) as res:
              print("CURRENT_EVENT_ENDPOINT_POST_STATUS",res.status)
          except urllib.error.HTTPError as e:
            print("CURRENT_EVENT_ENDPOINT_POST_STATUS",e.code)
          except Exception as e:
            print("CURRENT_EVENT_ENDPOINT_CHECK_ERROR",type(e).__name__)
          PY